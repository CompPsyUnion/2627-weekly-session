<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr-bad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-good" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="920" height="430" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">为什么双哈希步长必须与表长 m 互质？—— 环形槽位探测轨迹对比</text>

  <!-- Left Card: Non-coprime (m=12, step=8) -->
  <rect x="24" y="54" width="424" height="354" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <text x="236" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">❌ 反例：m = 12，起点 = 0，步长 = 8</text>
  <text x="236" y="104" text-anchor="middle" font-size="13" fill="#475569">gcd(12, 8) = 4 ≠ 1 → 仅能访问 12 / 4 = 3 个槽位</text>

  <!-- Circle center: (236, 238), R = 95 -->
  <g transform="translate(236, 238)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Triangle Cycle: 0 (0,-95) -> 8 (-82.3, 47.5) -> 4 (82.3, 47.5) -> 0 -->
    <line x1="-10" y1="-78" x2="-68" y2="32" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-bad)"/>
    <line x1="-64" y1="47.5" x2="62" y2="47.5" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-bad)"/>
    <line x1="72" y1="30" x2="10" y2="-78" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-bad)"/>

    <!-- 12 nodes around R=95: angle = k * 30 deg from top -->
    <!-- k=0: (0, -95) ACTIVE -->
    <circle cx="0" cy="-95" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="0" y="-90" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">0</text>

    <!-- k=1: (47.5, -82.3) UNREACHABLE -->
    <circle cx="47.5" cy="-82.3" r="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="47.5" y="-77.3" text-anchor="middle" font-size="12" fill="#94a3b8">1</text>

    <!-- k=2: (82.3, -47.5) -->
    <circle cx="82.3" cy="-47.5" r="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="82.3" y="-42.5" text-anchor="middle" font-size="12" fill="#94a3b8">2</text>

    <!-- k=3: (95, 0) -->
    <circle cx="95" cy="0" r="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="95" y="5" text-anchor="middle" font-size="12" fill="#94a3b8">3</text>

    <!-- k=4: (82.3, 47.5) ACTIVE -->
    <circle cx="82.3" cy="47.5" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="82.3" y="52.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">4</text>

    <!-- k=5: (47.5, 82.3) -->
    <circle cx="47.5" cy="82.3" r="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="47.5" y="87.3" text-anchor="middle" font-size="12" fill="#94a3b8">5</text>

    <!-- k=6: (0, 95) -->
    <circle cx="0" cy="95" r="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="0" y="100" text-anchor="middle" font-size="12" fill="#94a3b8">6</text>

    <!-- k=7: (-47.5, 82.3) -->
    <circle cx="-47.5" cy="82.3" r="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="-47.5" y="87.3" text-anchor="middle" font-size="12" fill="#94a3b8">7</text>

    <!-- k=8: (-82.3, 47.5) ACTIVE -->
    <circle cx="-82.3" cy="47.5" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="-82.3" y="52.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">8</text>

    <!-- k=9: (-95, 0) -->
    <circle cx="-95" cy="0" r="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="-95" y="5" text-anchor="middle" font-size="12" fill="#94a3b8">9</text>

    <!-- k=10: (-82.3, -47.5) -->
    <circle cx="-82.3" cy="-47.5" r="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="-82.3" y="-42.5" text-anchor="middle" font-size="12" fill="#94a3b8">10</text>

    <!-- k=11: (-47.5, -82.3) -->
    <circle cx="-47.5" cy="-82.3" r="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="-47.5" y="-77.3" text-anchor="middle" font-size="12" fill="#94a3b8">11</text>
  </g>

  <text x="236" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">轨迹锁死在 0 → 8 → 4 → 0 循环中</text>
  <text x="236" y="392" text-anchor="middle" font-size="12" fill="#64748b">其余 9 个灰色空槽永远无法被探测到！</text>

  <!-- Right Card: Coprime (m=11, start=2, step=3) -->
  <rect x="472" y="54" width="424" height="354" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="684" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">✅ 正例：m = 11，起点 = 2，步长 = 3</text>
  <text x="684" y="104" text-anchor="middle" font-size="13" fill="#475569">gcd(11, 3) = 1（互质）→ 走遍全部 11 / 1 = 11 个槽位</text>

  <!-- 11 nodes around (684, 238), R=95:
       k=0: (0, -95)
       k=1: (51.4, -79.9)
       k=2: (86.4, -39.4)
       k=3: (94.0, 13.5)
       k=4: (71.8, 62.2)
       k=5: (26.8, 91.1)
       k=6: (-26.8, 91.1)
       k=7: (-71.8, 62.2)
       k=8: (-94.0, 13.5)
       k=9: (-86.4, -39.4)
       k=10: (-51.4, -79.9)
       Order: 2 -> 5 -> 8 -> 0 -> 3 -> 6 -> 9 -> 1 -> 4 -> 7 -> 10 -> 2
  -->
  <g transform="translate(684, 238)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Star polygon path visiting all 11 vertices -->
    <polygon points="86.4,-39.4 26.8,91.1 -94.0,13.5 0,-95 94.0,13.5 -26.8,91.1 -86.4,-39.4 51.4,-79.9 71.8,62.2 -71.8,62.2 -51.4,-79.9"
             fill="none" stroke="#16a34a" stroke-width="1.8" stroke-opacity="0.75"/>

    <!-- Highlight first step 2 -> 5 with arrow -->
    <line x1="78" y1="-24" x2="34" y2="75" stroke="#15803d" stroke-width="2.5" marker-end="url(#arr-good)"/>

    <!-- Nodes -->
    <circle cx="0" cy="-95" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="-90" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">0</text>

    <circle cx="51.4" cy="-79.9" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="51.4" y="-74.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">1</text>

    <!-- Start node k=2 highlighted -->
    <circle cx="86.4" cy="-39.4" r="18" fill="#16a34a" stroke="#14532d" stroke-width="2.5"/>
    <text x="86.4" y="-34.4" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>

    <circle cx="94.0" cy="13.5" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="94.0" y="18.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">3</text>

    <circle cx="71.8" cy="62.2" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="71.8" y="67.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">4</text>

    <circle cx="26.8" cy="91.1" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="26.8" y="96.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">5</text>

    <circle cx="-26.8" cy="91.1" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="-26.8" y="96.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">6</text>

    <circle cx="-71.8" cy="62.2" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="-71.8" y="67.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">7</text>

    <circle cx="-94.0" cy="13.5" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="-94.0" y="18.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">8</text>

    <circle cx="-86.4" cy="-39.4" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="-86.4" y="-34.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">9</text>

    <circle cx="-51.4" cy="-79.9" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="-51.4" y="-74.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">10</text>
  </g>

  <text x="684" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">2 → 5 → 8 → 0 → 3 → 6 → 9 → 1 → 4 → 7 → 10</text>
  <text x="684" y="392" text-anchor="middle" font-size="12" fill="#64748b">只要表中还有空位，就一定能找到！</text>
</svg>
