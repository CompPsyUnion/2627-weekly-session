<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="920" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">开放寻址对比：线性探测 vs. 双哈希（依次插入 22、33、44、55，表长 m = 11）</text>

  <!-- Panel 1: Linear Probing -->
  <rect x="24" y="54" width="872" height="162" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="80" font-size="15" font-weight="bold" fill="#dc2626">① 线性探测：h(k, i) = (h₁(k) + i) % 11 — 步长固定为 1，同起点元素挤成连续块（一次聚集）</text>
  <text x="44" y="102" font-size="13" fill="#475569">22、33、44、55 的初始位置 h₁(k) 均为 0，后续元素被迫排长队逐格向后顺延：</text>

  <!-- Linear Probing Slots -->
  <!-- Slot 0..10: x = 44 + idx * 74 -->
  <g transform="translate(44, 136)">
    <!-- Occupied cluster highlight -->
    <rect x="-6" y="-26" width="300" height="68" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="4,3" stroke-width="1.5"/>
    <text x="144" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">连续占用区（4 连格聚集，新元素落入 0~3 都要排到槽 4）</text>

    <!-- Slots -->
    <g>
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#64748b">槽 0</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">22</text>
    </g>
    <g transform="translate(74, 0)">
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#64748b">槽 1</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">33</text>
    </g>
    <g transform="translate(148, 0)">
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#64748b">槽 2</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">44</text>
    </g>
    <g transform="translate(222, 0)">
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#64748b">槽 3</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">55</text>
    </g>
    <!-- Empty slots 4..10 -->
    <g transform="translate(296, 0)">
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#94a3b8">槽 4</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(370, 0)">
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#94a3b8">槽 5</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(444, 0)">
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#94a3b8">槽 6</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(518, 0)">
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#94a3b8">槽 7</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(592, 0)">
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#94a3b8">槽 8</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(666, 0)">
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#94a3b8">槽 9</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(740, 0)">
      <text x="27" y="-8" text-anchor="middle" font-size="12" fill="#94a3b8">槽 10</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>

    <!-- Step +1 arrows -->
    <path d="M56,18 L72,18" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <path d="M130,18 L146,18" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <path d="M204,18 L220,18" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  </g>

  <!-- Panel 2: Double Hashing -->
  <rect x="24" y="232" width="872" height="168" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="258" font-size="15" font-weight="bold" fill="#2563eb">② 双哈希：h(k, i) = (h₁(k) + i × h₂(k)) % 11 — 步长 h₂(k) = 7 - (k % 7) 因 Key 而异，同起点立即分流</text>

  <g transform="translate(44, 332)">
    <!-- Jump arcs from Slot 0 (x=27) -->
    <!-- 55: step +1 -> Slot 1 (x=101) -->
    <path d="M 32,-18 Q 66,-44 96,-18" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="66" y="-34" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">55: +1</text>

    <!-- 33: step +2 -> Slot 2 (x=175) -->
    <path d="M 27,-18 Q 101,-62 171,-18" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="108" y="-44" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">33: 步长 +2</text>

    <!-- 44: step +5 -> Slot 5 (x=397) -->
    <path d="M 22,-18 Q 210,-80 393,-18" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="235" y="-52" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">44: 步长 +5（一次跳过拥挤区）</text>

    <!-- Slots -->
    <g>
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#64748b">槽 0</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">22</text>
    </g>
    <g transform="translate(74, 0)">
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#64748b">槽 1</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">55</text>
    </g>
    <g transform="translate(148, 0)">
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#64748b">槽 2</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">33</text>
    </g>
    <g transform="translate(222, 0)">
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#94a3b8">槽 3</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(296, 0)">
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#94a3b8">槽 4</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(370, 0)">
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#64748b">槽 5</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">44</text>
    </g>
    <g transform="translate(444, 0)">
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#94a3b8">槽 6</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(518, 0)">
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#94a3b8">槽 7</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(592, 0)">
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#94a3b8">槽 8</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(666, 0)">
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#94a3b8">槽 9</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>
    <g transform="translate(740, 0)">
      <text x="27" y="-4" text-anchor="middle" font-size="12" fill="#94a3b8">槽 10</text>
      <rect x="0" y="0" width="54" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="27" y="23" text-anchor="middle" font-size="14" fill="#94a3b8">·</text>
    </g>

    <text x="397" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">33、44、55 在槽 0 碰撞后各走各的步长，均只需 1 次额外探测即可落位</text>
  </g>
</svg>
